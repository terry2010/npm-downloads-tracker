name: Update downloads dashboard

on:
  schedule:
    - cron: '13 * * * *' # hourly at :13 UTC — npm backfills recent days in batches, hourly picks corrections up fast
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-downloads-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch downloads and rebuild dashboard
        run: node scripts/update.mjs

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update npm downloads dashboard'
